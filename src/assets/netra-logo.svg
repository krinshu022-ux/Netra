<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Eye / Lens Icon -->
  <g transform="translate(4, 6)">
    <circle cx="24" cy="24" r="23" fill="#071B3A" stroke="#174EA6" stroke-width="2"/>
    <!-- Outer radar rings -->
    <circle cx="24" cy="24" r="17" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>
    <circle cx="24" cy="24" r="11" stroke="#FF9933" stroke-width="1.8" fill="none"/>
    <!-- Center pupil / node -->
    <circle cx="24" cy="24" r="5" fill="#38BDF8"/>
    <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
    <!-- Crosshairs -->
    <path d="M24 1 V10 M24 38 V47 M1 24 H10 M38 24 H47" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="60" y="32" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="2">NETRA</text>
  <!-- Tricolor bar accent under NETRA -->
  <rect x="60" y="37" width="18" height="2" fill="#FF9933" rx="1"/>
  <rect x="79" y="37" width="18" height="2" fill="#FFFFFF" rx="1"/>
  <rect x="98" y="37" width="18" height="2" fill="#138808" rx="1"/>
  <text x="60" y="49" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" fill="#93C5FD" letter-spacing="0.5">NETWORK INTELLIGENCE &amp; RISK ANALYSIS</text>
</svg>
